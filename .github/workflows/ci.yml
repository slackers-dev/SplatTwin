name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (Pipeline und Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Nur das Paket splattwin, ohne das Extra [vision] (mediapipe, rembg): die Tests brauchen es nicht.
      - run: uv sync --package splattwin --locked
      - run: uv run --package splattwin ruff check python
      - run: uv run --package splattwin ruff format --check python
      - run: uv run --package splattwin pytest python

  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:contracts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
