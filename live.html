<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splattwin – Zuschauen</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  :root { color-scheme: dark; --bg: #14161a; --panel: #1e2127ee; --line: #343944; --text: #e6e8ec; --dim: #9aa1ad; --ok: #6cc59a; --warn: #e0b45a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .mirror #scene { transform: scaleX(-1); }
  #panel { position: fixed; top: 12px; left: 12px; right: auto; max-width: calc(100% - 24px); box-sizing: border-box; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #panel h1 { margin: 0 0 2px; font-size: 15px; }
  #status { margin: 0; color: var(--dim); font-variant-numeric: tabular-nums; }
  #status::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--warn); }
  #status.ok::before { background: var(--ok); }
  #panel label { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel">
  <h1>Splattwin · Zuschauen</h1>
  <p id="status">lade …</p>
  <label><input id="splat" type="checkbox" checked disabled> Splat statt Roboter</label>
</div>
<script type="module" src="./live.js"></script>
</body>
</html>
