# Rechnen auf einer gemieteten GPU bei RunPod, mit pod-do (https://github.com/slackers-dev/pod-do).
# Einrichten und Befehle: scripts/pod-do/README.md
project = "splattwin"

# LHM++: Avatar als Gaussian Splat auf SMPL-X aus wenigen Fotos. Braucht etwa 8 GB VRAM.
[env.lhm]
image = "runpod/pytorch:2.2.0-py3.10-cuda12.1.1-devel-ubuntu22.04"
# Fertige Umgebung als privates Image (pod-do image lhm). Ohne Registry-Zugang: Archiv auf dem Volume.
docker = "ghcr.io/slackers-dev/splattwin-lhm"
min_vram = 8
# torch 2.3 kennt Blackwell (RTX 50xx, PRO 6000) noch nicht: nur Ampere, Ada, Hopper
gpus = ["NVIDIA RTX 2000 Ada Generation", "NVIDIA RTX A4500", "NVIDIA RTX A4000", "NVIDIA RTX 4000 Ada Generation",
        "NVIDIA RTX A5000", "NVIDIA L4", "NVIDIA A40", "NVIDIA GeForce RTX 4090"]
cuda = "12.1"
disk = 80
boot = "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git libgl1 libglib2.0-0 ffmpeg >/dev/null"
setup_file = "scripts/pod-do/setup-lhm.sh"
vars = { PYTHONUNBUFFERED = "1" }

[task.lhm]
env = "lhm"
args = ["fotos", "name?"]
defaults = { name = "{fotos.name}" }
before = "bash scripts/pod-do/fotos-vorbereiten.sh"
upload = { "images" = "data/lhm/{name}/fotos", "lhm_export.py" = "scripts/pod-do/lhm_export.py" }
run = '''
n=$(ls images | wc -l)
views=$(( n > 16 ? 16 : n ))
mkdir -p out
cd "$POD_DO_ENV/LHM-plusplus" && source .venv/bin/activate
# wie to_gs_ply.py, schreibt zusaetzlich out/skin.npz (SMPL-X-Gewichte)
python "$JOB/lhm_export.py" \
  --model_name LHMPP-700M-PixelShuffle --model_path ./pretrained_models/LHMPP-700M-PixelShuffle \
  --images_dir "$JOB/images" --ref_view "$views" --output "$JOB/out/avatar.ply"
'''
download = { "out" = "data/lhm/{name}" }
after = "uv run python scripts/pod-do/lhm_zum_viewer.py \"$NAME\""   # -> viewer.html?run=lhm-<name>
