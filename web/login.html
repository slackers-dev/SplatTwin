<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splattwin – Presenter-Login</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
</head>
<body>
<form id="form">
  <div class="brand">
    <img src="/logo.svg" alt="">
    <div><h1>Presenter-Login</h1><p>SplatTwin · Bühne</p></div>
  </div>
  <fieldset>
    <legend>Dein Platz auf der Bühne</legend>
    <label class="slot" style="--c: var(--mint)"><input type="radio" name="slot" value="A" checked><span>A · links</span></label>
    <label class="slot" style="--c: var(--blue)"><input type="radio" name="slot" value="B"><span>B · rechts</span></label>
  </fieldset>
  <label class="pw">Passwort<input id="pw" type="password" autocomplete="current-password" required></label>
  <button>Einloggen</button>
  <p id="msg" role="alert"></p>
</form>
<script type="module" src="/src/pages/login/main.ts"></script>
</body>
</html>
