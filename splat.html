<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splattwin – Splat</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
  :root { color-scheme: dark; --bg: #14161a; --panel: #1e2127ee; --line: #343944; --text: #e6e8ec; --dim: #9aa1ad; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; }
  #panel { z-index: 1; position: fixed; top: 12px; left: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #panel h1 { margin: 0 0 4px; font-size: 15px; }
  #panel p { margin: 0; color: var(--dim); }
  #panel a { color: var(--text); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>
</head>
<body>
<div id="panel">
  <h1>Splattwin · Gaussian Splat</h1>
  <p id="status">lade …</p>
  <p><a href="./">zum Live-Avatar</a></p>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

// ?run=<Name> waehlt einen Lauf der Pipeline aus splat/runs/.
const run = new URLSearchParams(location.search).get('run') || 'IMG_0706';
const base = `./splat/runs/${encodeURIComponent(run)}/`;
const status = document.getElementById('status');

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.add(new SparkRenderer({ renderer }));
const grid = new THREE.GridHelper(4, 8, 0x4a505c, 0x2a2f38);
scene.add(grid);

const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);
camera.position.set(0, 1.3, 3.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

try {
  // splat.json stellt den Splat aufrecht, auf den Boden und auf Koerpergroesse.
  const pose = await fetch(base + 'splat.json').then((r) => (r.ok ? r.json() : null));
  const splat = new SplatMesh({ url: base + 'splat.ply' });
  if (pose) {
    new THREE.Matrix4().set(...pose.matrix.flat()).decompose(splat.position, splat.quaternion, splat.scale);
  }
  scene.add(splat);
  await splat.initialized;
  status.textContent = `${run}${pose ? '' : ' (ohne Ausrichtung)'} · ziehen zum Drehen`;
} catch (err) {
  status.textContent = `Fehler: ${err.message}`;
}

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
