<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splattwin – Aufnahme</title>
<style>
  :root { color-scheme: dark; --bg: #14161a; --panel: #1e2127; --line: #343944; --text: #e6e8ec; --dim: #9aa1ad; --ok: #6cc4a1; --bad: #e5625e; --warn: #e0b354; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; padding: 12px 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; gap: 10px; }
  a { color: var(--text); }
  .bar { display: grid; grid-template-columns: 1.4fr 1.1fr 0.9fr repeat(5, 0.7fr) 1fr; gap: 10px; align-items: end; }
  .bar label { color: var(--dim); font-size: 12px; min-width: 0; }
  select, input, button { display: block; width: 100%; margin-top: 3px; padding: 7px 8px; background: #2a2f38; color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button { cursor: pointer; font-weight: 600; background: #2f4a40; border-color: #3f6a5a; }
  button:disabled { opacity: 0.5; cursor: default; }
  #phase { font-size: 40px; font-weight: 650; line-height: 1.15; min-height: 46px; }
  #phase.rec::before { content: "● "; color: var(--bad); }
  #bar { height: 10px; background: var(--panel); border-radius: 5px; overflow: hidden; flex: none; }
  #bar i { display: block; height: 100%; width: 0; background: var(--ok); }
  .stage { flex: 1; min-height: 240px; display: flex; gap: 12px; }
  .view { position: relative; flex: 1; min-width: 0; background: #000; border: 3px solid var(--line); border-radius: 10px; overflow: hidden; }
  .view.ok { border-color: var(--ok); }
  .view.bad { border-color: var(--bad); }
  .view video, .view canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .view video, .view canvas.pic { object-fit: contain; }
  .view .tag { position: absolute; left: 10px; top: 8px; padding: 3px 9px; background: #000a; border-radius: 6px; font-size: 18px; font-weight: 600; }
  .view[hidden] { display: none; }
  pre { margin: 0; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; white-space: pre-wrap; word-break: break-all; flex: none; }
  @media (max-width: 900px) { .bar { grid-template-columns: 1fr 1fr; } .stage { flex-direction: column; } #phase { font-size: 26px; } }
</style>
<script type="importmap">
{ "imports": { "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs" } }
</script>
</head>
<body>
  <div class="bar">
    <label>Kamera A – vorne (dorthin schaust du am Anfang)<select id="camA"></select></label>
    <label>Kamera B – nur Kontrolle (optional)<select id="camB"></select></label>
    <label>Name<input id="name" value="aufnahme"></label>
    <label>Leerer Raum (s)<input id="tBg" type="number" min="1" value="4"></label>
    <label>Drehung etwa (s)<input id="tTurn" type="number" min="3" value="20"></label>
    <label>Bild drehen<select id="rot"><option value="0">nein</option><option value="90">90° nach rechts</option><option value="270">90° nach links</option></select></label>
    <label>Gesichtsscan<select id="face"><option value="1">ja</option><option value="0">nein</option></select></label>
    <label>&nbsp;<a href="./">Live-Avatar</a></label>
    <button id="start">Aufnahme starten</button>
  </div>
  <div id="phase">Lade …</div>
  <div id="bar"><i></i></div>
  <div class="stage">
    <div class="view" id="viewA"><video id="videoA" playsinline muted autoplay></video><canvas class="pic" hidden></canvas><canvas class="overlay"></canvas><span class="tag">A</span></div>
    <div class="view" id="viewB"><video id="videoB" playsinline muted autoplay></video><canvas class="pic" hidden></canvas><canvas class="overlay"></canvas><span class="tag">B</span></div>
  </div>
  <pre id="out" hidden></pre>

<script type="module">
import { PoseLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

const POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task';
const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
const LM = { nose: 0, lSh: 11, rSh: 12, lWr: 15, rWr: 16, lHip: 23, rHip: 24, lKn: 25, rKn: 26, lAn: 27, rAn: 28 };
const LINES = [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]];

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
// Zum Testen ohne Kamera: ?srcA=<Videodatei> (und srcB) spielt ein Video als Kamerabild ab.
const SRC = { a: params.get('srcA'), b: params.get('srcB') };
const num = (key, fallback) => (params.get(key) ? +params.get(key) : fallback);
const HOLD = num('hold', 1.5);        // so lange muss die Pose stimmen, bevor die Drehung beginnt
const GATE_TIMEOUT = num('gate', 40); // danach geht es auch ohne erfuellte Bedingung weiter
if (params.get('bg')) $('tBg').value = params.get('bg');
if (params.get('turn')) $('tTurn').value = params.get('turn');

let mode = 'body'; // 'face' waehrend des Gesichtsscans: dann gelten andere Pruefungen
const cams = {};
for (const key of ['a', 'b']) {
  const view = $('view' + key.toUpperCase());
  cams[key] = { key, select: $('cam' + key.toUpperCase()), view, video: view.querySelector('video'),
    canvas: view.querySelector('.overlay'), pic: view.querySelector('.pic'), size: [0, 0], tag: view.querySelector('.tag'), stream: null, landmarker: null,
    lastTime: -1, state: { present: false, full: false, hint: '', yaw: null, center: null } };
}

function phase(text, rec = false) {
  $('phase').textContent = text;
  $('phase').classList.toggle('rec', rec);
}
const progress = (f) => { $('bar').firstElementChild.style.width = `${Math.max(0, Math.min(f, 1)) * 100}%`; };

let lastSaid = { text: '', at: 0 };
function say(text, minGap = 0) {
  const now = performance.now();
  if (text === lastSaid.text && now - lastSaid.at < minGap * 1000) return;
  lastSaid = { text, at: now };
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    speechSynthesis.speak(u);
  } catch { /* Ansage ist nur Komfort */ }
}

// ---------------------------------------------------------------- Kameras
async function openCamera(key) {
  const cam = cams[key];
  cam.stream?.getTracks().forEach((t) => t.stop());
  cam.stream = null;
  if (SRC[key]) {
    cam.video.src = SRC[key];
    cam.video.autoplay = false;
    await new Promise((r) => cam.video.addEventListener('loadeddata', r, { once: true }));
    cam.stream = cam.video.captureStream();
  } else if (cam.select.value) {
    cam.stream = await navigator.mediaDevices.getUserMedia({
      // 1920x1440 ist das volle Bild des Handys (4:3). Mit 1920x1080 schneidet der Browser oben und unten ab.
      video: { deviceId: { exact: cam.select.value }, width: { ideal: 1920 }, height: { ideal: 1440 }, frameRate: { ideal: 30 } },
    });
    // Hinweis: Chrome lieferte das iPhone ueber die Integrationskamera bisher nur mit 1280x720.
    // Ein Versuch mit 1920x1080 und 1920x1440 wurde abgelehnt, allerdings waehrend das Handy
    // gerade kein Bild schickte; mit laufendem Bild noch nicht nachgeprueft.
    cam.video.srcObject = cam.stream;
    cam.video.play().catch(() => {}); // nicht darauf warten: ohne Bild vom Handy kaeme das nie zurueck
  } else cam.video.srcObject = null;
  cam.view.hidden = !cam.stream;
}

async function listCameras() {
  let devices = [];
  if (!SRC.a) {
    // Erst nach der Freigabe liefert der Browser die Namen der Kameras.
    const probe = await navigator.mediaDevices.getUserMedia({ video: true });
    probe.getTracks().forEach((t) => t.stop());
    devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
  }
  for (const cam of Object.values(cams)) {
    cam.select.innerHTML = (cam.key === 'b' ? '<option value="">keine</option>' : '')
      + devices.map((d, i) => `<option value="${d.deviceId}">${d.label || 'Kamera ' + (i + 1)}</option>`).join('');
    cam.select.addEventListener('change', () => openCamera(cam.key).catch(showError));
  }
  // Das Handy ist die bessere Kamera: wenn eines verbunden ist, wird es Kamera A.
  const phone = devices.find((d) => /iphone|ipad|handy|phone/i.test(d.label));
  if (phone) cams.a.select.value = phone.deviceId;
  await Promise.all([openCamera('a'), openCamera('b')]);
}

function showError(err) {
  console.error(err);
  phase('Fehler: ' + err.message);
  $('start').disabled = false;
}

// ---------------------------------------------------------------- Koerpererkennung
// Prueft pro Kamera, ob eine Person da ist, ob sie ganz im Bild ist und wohin sie schaut.
function analyse(cam, result) {
  const img = result.landmarks?.[0], world = result.worldLandmarks?.[0];
  const s = cam.state;
  const seen = (i, min = 0.5) => (img[i].visibility ?? 1) >= min && img[i].x > 0.01 && img[i].x < 0.99 && img[i].y > 0.01 && img[i].y < 0.99;
  s.present = !!img && [LM.nose, LM.lSh, LM.rSh, LM.lHip, LM.rHip].filter((i) => (img[i].visibility ?? 1) > 0.5).length >= 2;
  s.img = s.present ? img : null;
  if (!s.present) { s.full = false; s.hint = ''; s.yaw = null; s.center = null; return; }
  // Kopfgroesse im Bild: Abstand Nase bis Schulterlinie, als Anteil der Bildhoehe.
  const shY = (img[LM.lSh].y + img[LM.rSh].y) / 2;
  s.head = shY - img[LM.nose].y;
  if (mode === 'face') {
    s.hint = !seen(LM.nose) ? 'Kopf nicht im Bild'
      : img[LM.nose].y - 0.9 * s.head < 0.02 ? 'Kopf oben abgeschnitten, etwas zurück'
      : s.head < 0.16 ? 'Näher kommen' : '';
  } else {
    s.hint = !seen(LM.nose) ? 'Kopf nicht im Bild'
      : !(seen(LM.lAn, 0.3) && seen(LM.rAn, 0.3)) ? 'Füsse nicht im Bild'
      : !(seen(LM.lWr, 0.3) || seen(LM.rWr, 0.3)) ? 'Hände nicht im Bild' : '';
  }
  s.full = !s.hint;
  s.center = [(img[LM.lSh].x + img[LM.rSh].x) / 2, shY]; // Schultermitte, auch in der Nahaufnahme sichtbar
  // Blickrichtung aus der Schulterlinie in 3D: 0 Grad = schaut in die Kamera.
  const dx = world[LM.lSh].x - world[LM.rSh].x, dz = world[LM.lSh].z - world[LM.rSh].z;
  s.yaw = Math.atan2(dz, dx) * 180 / Math.PI;
}

function draw(cam) {
  const { canvas, video, state } = cam;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, w, h);
  cam.view.classList.toggle('ok', state.present && state.full);
  cam.view.classList.toggle('bad', state.present && !state.full);
  cam.tag.textContent = cam.key.toUpperCase() + (cam.size[0] ? ` · ${cam.size[0]}×${cam.size[1]}` : '') + (state.present ? (state.full ? ' · gut im Bild' : ' · ' + state.hint) : ' · niemand');
  if (!video.videoWidth) cam.tag.textContent = cam.key.toUpperCase() + ' · kein Bild – ist das Handy entsperrt und in der Nähe?';
  if (!state.img || !cam.size[0]) return;
  // Gleiche Einpassung wie object-fit: contain.
  const [vw, vh] = cam.size;
  const k = Math.min(w / vw, h / vh);
  const ox = (w - vw * k) / 2, oy = (h - vh * k) / 2;
  const px = (p) => [ox + p.x * vw * k, oy + p.y * vh * k];
  g.lineWidth = 3;
  g.strokeStyle = state.full ? '#6cc4a1' : '#e5625e';
  g.beginPath();
  for (const [i, j] of LINES) { g.moveTo(...px(state.img[i])); g.lineTo(...px(state.img[j])); }
  g.stroke();
}

// Liefert das aufrechte Bild der Kamera. Steht das Handy hochkant, kommt sein Bild je nach
// System liegend an: dann wird es hier gedreht, fuer die Anzeige und fuer die Koerpererkennung.
function upright(cam) {
  const { video, pic } = cam;
  const rot = cam.key === 'a' ? +$('rot').value : 0;
  pic.hidden = !rot;
  video.style.visibility = rot ? 'hidden' : '';
  if (!rot) { cam.size = [video.videoWidth, video.videoHeight]; return video; }
  if (pic.width !== video.videoHeight || pic.height !== video.videoWidth) { pic.width = video.videoHeight; pic.height = video.videoWidth; }
  const g = pic.getContext('2d');
  g.save();
  if (rot === 90) { g.translate(pic.width, 0); g.rotate(Math.PI / 2); } else { g.translate(0, pic.height); g.rotate(-Math.PI / 2); }
  g.drawImage(video, 0, 0);
  g.restore();
  cam.size = [pic.width, pic.height];
  return pic;
}

function tick(now) {
  for (const cam of Object.values(cams)) {
    if (!cam.stream) continue;
    if (!cam.landmarker || cam.video.readyState < 2) { draw(cam); continue; }
    if (cam.video.currentTime !== cam.lastTime) {
      cam.lastTime = cam.video.currentTime;
      analyse(cam, cam.landmarker.detectForVideo(upright(cam), now));
    }
    draw(cam);
  }
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- Aufnahme
const MIME = ['video/mp4;codecs=avc1.640028', 'video/webm;codecs=vp9', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));

function record(stream) {
  const rec = new MediaRecorder(stream, { mimeType: MIME, videoBitsPerSecond: 16_000_000 });
  const chunks = [];
  const state = { rec, startedAt: null };
  rec.addEventListener('start', () => { state.startedAt = performance.now(); });
  rec.addEventListener('dataavailable', (e) => chunks.push(e.data));
  state.done = new Promise((resolve) => rec.addEventListener('stop', () => resolve(new Blob(chunks, { type: MIME }))));
  rec.start(1000);
  return state;
}

const frame = () => new Promise((r) => requestAnimationFrame(r));
const active = () => Object.values(cams).filter((c) => c.stream);

// Wartet, bis cond() "hold" Sekunden lang ununterbrochen gilt. Liefert den Zeitpunkt,
// an dem diese Strecke begann, oder null nach "timeout" Sekunden.
async function waitFor(cond, hold, timeout, onWait) {
  const t0 = performance.now();
  let since = null;
  for (;;) {
    const now = performance.now();
    if (cond()) since ??= now; else since = null;
    progress(since === null ? 0 : (now - since) / 1000 / hold);
    if (since !== null && now - since >= hold * 1000) return since;
    if (now - t0 > timeout * 1000) return null;
    onWait?.();
    await frame();
  }
}

const wrap = (deg) => ((deg + 540) % 360) - 180;

async function upload(name, key, blob) {
  const kind = MIME.startsWith('video/mp4') ? 'mp4' : 'webm';
  const rot = key === 'a' ? $('rot').value : 0; // der Server dreht die gespeicherte Aufnahme gleich wie die Anzeige
  const r = await fetch(`/api/capture?name=${name}&cam=${key}&kind=${kind}&rot=${rot}`, { method: 'POST', body: blob });
  const info = await r.json();
  if (!r.ok) throw new Error(info.error);
  return info;
}

// Wartet, bis die Person richtig steht (je nach Modus), zur Kamera schaut und stillhaelt.
async function pose(label, notes, A) {
  let ref = null;
  const still = () => {
    if (!A.center) return false;
    if (!ref || Math.hypot(A.center[0] - ref[0], A.center[1] - ref[1]) > 0.03) { ref = A.center; return false; }
    return true;
  };
  const problem = () => {
    if (!A.present) return 'Ich sehe dich noch nicht';
    if (A.hint) return A.hint;
    if (Math.abs(A.yaw) > 25) return 'Dreh dich zur Kamera';
    return '';
  };
  const ok = await waitFor(() => !problem() && still(), HOLD, GATE_TIMEOUT, () => {
    const p = problem();
    phase(p || 'Gut so – kurz stillhalten', true);
    if (p) say(p, 6);
  });
  if (ok === null) notes.push(`${label}: Pose nicht bestaetigt (${problem() || 'nicht still'}), Drehung trotzdem gestartet.`);
}

// Zaehlt den Drehwinkel aus der Schulterlinie mit, bis 360 Grad voll sind. Liefert die Gradzahl.
async function turn(label, notes, A, turnSeconds) {
  say('Jetzt zügig und gleichmässig drehen, Arme ruhig.');
  const calls = [[0.25, 'Viertel'], [0.5, 'Halb'], [0.75, 'Drei Viertel']];
  let turned = 0, prevYaw = A.yaw, prevT = performance.now(), speed = 0;
  const t0 = performance.now();
  for (;;) {
    await frame();
    const now = performance.now(), elapsed = (now - t0) / 1000;
    if (A.yaw !== null && prevYaw !== null && now > prevT) {
      const d = wrap(A.yaw - prevYaw);
      // Spruenge um fast 180 Grad sind vertauschte Schultern, keine echte Drehung.
      if (Math.abs(d) < 60) {
        turned += d;
        speed += (Math.abs(d) / ((now - prevT) / 1000) - speed) * 0.05;
      }
    }
    if (A.yaw !== null) { prevYaw = A.yaw; prevT = now; }
    const f = Math.abs(turned) / 360;
    progress(f);
    phase(`${label}: gleichmässig drehen – ${Math.round(Math.abs(turned))}°`, true);
    while (calls.length && f >= calls[0][0]) say(calls.shift()[1]);
    if (speed > (360 / turnSeconds) * 1.8 && elapsed > 2) say('Langsamer', 5);
    // Zu langsam schadet mehr als zu schnell: je laenger die Drehung, desto mehr bewegt sich der Koerper.
    else if (speed < (360 / turnSeconds) * 0.6 && elapsed > 4) say('Schneller', 6);
    if (f >= 0.985) {
      if (elapsed > turnSeconds * 1.5)
        notes.push(`${label}: Drehung zu langsam (${Math.round(elapsed)} s statt etwa ${turnSeconds} s), der Splat wird unscharf.`);
      break;
    }
    if (elapsed > turnSeconds * 2 || (elapsed > turnSeconds * 1.2 && f < 0.5)) {
      notes.push(`${label}: Drehwinkel unsicher (${Math.round(Math.abs(turned))} Grad gezaehlt), nach Zeit beendet.`);
      break;
    }
  }
  return Math.round(turned);
}

async function run() {
  const name = $('name').value.trim();
  if (!/^[A-Za-z0-9_-]{1,40}$/.test(name)) throw new Error('Name: nur Buchstaben, Ziffern, - und _');
  if (!cams.a.stream || !cams.a.video.videoWidth) throw new Error('Kamera A liefert kein Bild');
  const bgSeconds = +$('tBg').value, turnSeconds = +$('tTurn').value;
  $('start').disabled = true;
  $('out').hidden = true;
  for (const cam of active()) if (SRC[cam.key]) await cam.video.play();

  const recs = {};
  for (const cam of active()) recs[cam.key] = record(cam.stream);
  while (Object.values(recs).some((r) => r.startedAt === null)) await new Promise((r) => setTimeout(r, 10));
  const t0 = recs.a.startedAt;
  const sec = (t) => (t - t0) / 1000; // Sekunden im Video A
  const marks = {}, notes = [];
  const A = cams.a.state;

  // 1. Leerer Raum: zaehlt nur, solange keine Kamera eine Person sieht.
  phase('Geh aus dem Bild', true);
  say('Aufnahme läuft. Geh aus dem Bild.');
  const empty = await waitFor(() => active().every((c) => !c.state.present), bgSeconds, 30,
    () => { if (active().some((c) => c.state.present)) phase('Geh aus dem Bild – ich sehe dich noch', true); else phase('Leerer Raum – draussen bleiben', true); });
  if (empty !== null) { marks.bgStart = sec(empty); marks.bgEnd = sec(performance.now()); }
  else notes.push('Kein leerer Raum erkannt: ohne Hintergrundbild.');

  // 2. Pose: ganz im Bild, schaut zu Kamera A, steht still.
  phase('Komm ins Bild und schau zu Kamera A', true);
  say('Komm ins Bild. Schau zur Kamera. Arme leicht vom Körper weg.');
  await pose('Körper', notes, A);

  // 3. Drehung: der Winkel der Schulterlinie wird mitgezaehlt, bis 360 Grad voll sind.
  marks.turnStart = sec(performance.now());
  marks.turnedDegrees = await turn('Körper', notes, A, turnSeconds);
  marks.turnEnd = sec(performance.now());

  // 4. Gesichtsscan: nah an die Kamera, zweite Drehung. Der leere Raum von vorhin gilt weiter.
  if ($('face').value === '1') {
    mode = 'face';
    phase('Komm nah an die Kamera', true);
    say('Gut. Jetzt komm nah an die Kamera, bis Kopf und Schultern das Bild füllen.');
    await pose('Gesicht', notes, A);
    marks.faceStart = sec(performance.now());
    marks.faceDegrees = await turn('Gesicht', notes, A, turnSeconds);
    marks.faceEnd = sec(performance.now());
    mode = 'body';
  }
  say('Fertig.');

  for (const r of Object.values(recs)) r.rec.stop();
  phase('Speichere und wandle um …');
  // Kamera B startet einen Hauch frueher oder spaeter: ein Ereignis liegt in B um "offset" spaeter.
  const offset = recs.b ? (recs.a.startedAt - recs.b.startedAt) / 1000 : 0;
  const saved = {};
  for (const [key, r] of Object.entries(recs)) saved[key] = await upload(name, key, await r.done);
  const meta = { name, marks, offset, saved, notes, mime: MIME };
  await fetch(`/api/capture?name=${name}&cam=a&kind=json`, { method: 'POST', body: JSON.stringify(meta, null, 1) });

  const f1 = (x) => x.toFixed(1);
  $('out').textContent =
    Object.entries(saved).map(([k, i]) => `Kamera ${k.toUpperCase()}: ${i.saved}, ${i.width}×${i.height}, ${i.seconds} s`).join('\n')
    + `\nKörper: ${Math.abs(marks.turnedDegrees)}° in ${f1(marks.turnEnd - marks.turnStart)} s`
    + (marks.faceStart !== undefined ? `\nGesicht: ${Math.abs(marks.faceDegrees)}° in ${f1(marks.faceEnd - marks.faceStart)} s` : '')
    + (notes.length ? '\nHinweise: ' + notes.join(' ') : '')
    + `\n\ncd projekt/splat\nuv run process_capture.py captures/${name}.json`;
  $('out').hidden = false;
  phase(notes.length ? 'Fertig – mit Hinweisen, siehe unten' : 'Fertig – Befehl steht unten');
  progress(0);
  $('start').disabled = false;
}

$('start').addEventListener('click', () => run().catch(showError));

// Jede Aufnahme bekommt einen eigenen Namen, damit keine aeltere ueberschrieben wird.
const d = new Date();
$('name').value = `scan-${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;

try {
  await listCameras();
  phase('Lade Körpererkennung …');
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  for (const cam of Object.values(cams)) {
    // Eigene Instanz pro Kamera: im Video-Modus merkt sich das Modell den Verlauf.
    cam.landmarker = await PoseLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: POSE_MODEL, delegate: 'GPU' }, runningMode: 'VIDEO', numPoses: 1,
    });
  }
  requestAnimationFrame(tick);
  phase('Bereit');
} catch (err) {
  showError(err);
}
</script>
